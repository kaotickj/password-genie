plugins { id 'com.android.application' }
android {
    namespace 'com.kaotickj.passwordgenie'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kaotickj.passwordgenie'
        minSdk 26
        targetSdk 36
        versionCode 20100
        versionName '2.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Only the isolated CI build may explicitly defer signing to a
            // separate runner. Normal release builds still require the key.
            if (System.getenv('PASSWORD_GENIE_UNSIGNED_RELEASE') != '1') {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
