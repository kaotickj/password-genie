# Install as .github/workflows/password-genie-signing.yml on the
# signing/password-genie branch of kaotickj/Python-Music-Player.
# Only change SOURCE_SHA after reviewing the new Password Genie revision.
name: Sign Password Genie Android
on:
  push:
    branches: [signing/password-genie]
    paths: [.github/workflows/password-genie-signing.yml]
permissions:
  contents: read
concurrency:
  group: password-genie-signing
  cancel-in-progress: false
env:
  SOURCE_SHA: 616fcccbdf91e953f3c665ca378ee440b429a36b
  # Public certificate digest verified against the existing signed K-Tunes APK.
  SIGNER_SHA256: 6f289ade4d7c49f94390c1a791b880d941ad72a86fda9079f216506dea616794
jobs:
  build:
    if: github.repository == 'kaotickj/Python-Music-Player'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: kaotickj/password-genie
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reject private tracked files
        run: python scripts/check_private_files.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build without signing credentials
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Inspect unsigned APK
        run: |
          python scripts/check_package_contents.py android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "^package: name='com.kaotickj.passwordgenie' versionCode='20100' versionName='2.1.0'" "$RUNNER_TEMP/badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: password-genie-unsigned
          if-no-files-found: error
          retention-days: 1
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Fresh runner: no application checkout, Gradle, or app scripts here.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: password-genie-unsigned
          path: unsigned
      - name: Independently check APK identity and private data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import zipfile
          paths = list(Path('unsigned').rglob('*'))
          assert len(paths) == 1 and paths[0].name == 'app-release-unsigned.apk'
          headers = (b'SQLite format 3\x00', b'%PDF-', b'-----BEGIN PRIVATE KEY',
                     b'-----BEGIN RSA PRIVATE KEY', b'-----BEGIN OPENSSH PRIVATE KEY')
          with zipfile.ZipFile(paths[0]) as archive:
              for item in archive.infolist():
                  name = item.filename.replace('\\', '/').lower()
                  leaf = PurePosixPath(name).name
                  assert not re.search(r'\.(?:db|sqlite3?)(?:$|[.-])', name), 'Database in APK'
                  assert not leaf.endswith(('.pdf', '.pem', '.key', '.jks', '.keystore')), 'Private file in APK'
                  assert leaf not in ('passwords.txt', 'master_key.txt') and not leaf.startswith('.env')
                  if not item.is_dir():
                      with archive.open(item) as stream:
                          assert not stream.read(128).startswith(headers), 'Private payload in APK'
          print('Independent APK privacy check passed')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging unsigned/app-release-unsigned.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "^package: name='com.kaotickj.passwordgenie' versionCode='20100' versionName='2.1.0'" "$RUNNER_TEMP/badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"; then exit 1; fi
          mkdir signed
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
      - name: Sign using existing K-Tunes key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KTUNES_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KTUNES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KTUNES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KTUNES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          keystore="$RUNNER_TEMP/password-genie-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out signed/PasswordGenie-2.1.0-android-release.apk "$RUNNER_TEMP/aligned.apk"
      - name: Verify signature, certificate, and alignment
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/PasswordGenie-2.1.0-android-release.apk > "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 signed/PasswordGenie-2.1.0-android-release.apk
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          report = (Path(os.environ['RUNNER_TEMP']) / 'signature.txt').read_text()
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)$', report, re.M)
          assert certificates == [os.environ['SIGNER_SHA256']], 'Signing certificate differs from existing K-Tunes key'
          assert 'Verified using v2 scheme (APK Signature Scheme v2): true' in report
          apk = Path('signed/PasswordGenie-2.1.0-android-release.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent / 'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n')
          (apk.parent / 'build-verification.json').write_text(json.dumps({
              'source_repository': 'kaotickj/password-genie',
              'source_commit': os.environ['SOURCE_SHA'],
              'application_id': 'com.kaotickj.passwordgenie',
              'version_name': '2.1.0', 'version_code': 20100,
              'certificate_sha256': certificates[0], 'apk_sha256': digest,
              'signature_verified': True, 'release_not_debuggable': True,
              'private_data_scan_passed': True,
              'signing_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }, indent=2) + '\n')
          print('Release signature verified; certificate matches existing K-Tunes key')
          PY
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/password-genie-signing.jks" "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP/signature.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: password-genie-android-signed-release
          if-no-files-found: error
          retention-days: 90
          path: |
            signed/PasswordGenie-2.1.0-android-release.apk
            signed/SHA256SUMS.txt
            signed/build-verification.json
